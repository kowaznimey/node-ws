name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux SDK & Android Dependencies
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pre-Accept Android SDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Flet & Required Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet aiohttp requests charset-normalizer idna urllib3

      - name: Verify and Pack Flet App Structure
        run: |
          if [ ! -f "main.py" ]; then
            echo "Error: ပင်မမျက်နှာစာ main.py ဖိုင်အား ရှာမတွေ့ပါ။"
            exit 1
          fi
          
          mkdir -p src
          cp main.py src/main.py
          
          yes | flet build apk src

      - name: Upload Finished Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          # နေရာလွဲမှားမှုမရှိစေရန် ထွက်လာနိုင်သမျှသော APK ဖိုင်လမ်းကြောင်းအားလုံးကို သိမ်းကျုံးရှာဖွေခိုင်းခြင်း ဖြစ်သည်
          path: |
            build/**/*.apk
            dist/**/*.apk
            src/build/**/*.apk
            **/apk/*.apk
