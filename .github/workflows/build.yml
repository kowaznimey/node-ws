name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Utilities
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compiling and Assembly Production APK
        run: |
          mkdir -p src
          cp main.py src/main.py
          
          # AndroidManifest တွင် ကွန်ရက်အသုံးပြုခွင့် (Internet Permission) တိုက်ရိုက်ထည့်သွင်းခြင်း
          mkdir -p src/android/app/src/main
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          </manifest>' > src/android/app/src/main/AndroidManifest.xml

          yes | flet build apk src

      - name: Export Verified Distribution APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          path: src/build/apk/*.apk
