name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter & Android SDK dependencies
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Flet and Packages
        run: |
          pip install --upgrade pip
          pip install flet aiohttp requests charset-normalizer idna urllib3

      - name: Smart Search and Build APK
        run: |
          # လက်ရှိပရောဂျက်ထဲတွင် main.py ရှိမရှိ အရင်စစ်ဆေးသည်
          if [ ! -f "main.py" ]; then
            echo "main.py မတွေ့ရှိပါ။ အခြား Python ဖိုင်များကို လိုက်လံရှာဖွေနေပါသည်..."
            
            # Repository ထဲတွင် ရှိနေသော ပထမဆုံး .py ဖိုင်ကို ရှာဖွေပြီး main.py ဟု အမည်ပြောင်းလဲခြင်း
            TARGET_PY=$(find . -maxdepth 1 -name "*.py" | head -n 1)
            
            if [ -n "$TARGET_PY" ]; then
              echo "တွေ့ရှိထားသော ဖိုင်အမည်: $TARGET_PY အား main.py သို့ လဲလှယ်နေပါသည်..."
              mv "$TARGET_PY" main.py
            else
              echo "Error: မည်သည့် Python (.py) ဖိုင်မျှ ရှာမတွေ့ပါ။"
              exit 1
            fi
          fi
          
          # အဆင်သင့်ဖြစ်ပါက စတင် Build ခြင်း
          yes | flet build apk main.py
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          path: build/apk/*.apk
