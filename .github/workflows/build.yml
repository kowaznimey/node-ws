name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter & Android SDK dependencies
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          # ပိတ်မိနေတတ်သော Android SDK Licenses များအားလုံးကို ကြိုတင်၍ အလိုအလျောက် Accept လုပ်ခြင်း
          yes | flutter doctor --android-licenses || true

      - name: Install Flet and Packages
        run: |
          pip install --upgrade pip
          pip install flet aiohttp requests charset-normalizer idna urllib3

      - name: Fix Filename and Build APK
        run: |
          # ကစားသမားမှ main.py အား စာလုံးကြီးဖြင့် သိမ်းထားမိပါက သို့မဟုတ် နာမည်လွဲနေပါက Auto ပြင်ဆင်ရန်
          if [ -f "Main.py" ]; then mv Main.py main.py; fi
          if [ -f "apk" ]; then mv apk main.py; fi
          
          # သေချာစေရန် main.py ရှိမရှိ ထပ်မံစစ်ဆေးပြီး စတင် Build ခြင်း
          if [ ! -f "main.py" ]; then
            echo "Error: Python code file မတွေ့ရှိပါ။ ကျေးဇူးပြု၍ သင့်ဖိုင်အား main.py ဟု နာမည်ပေးထားပါ။"
            exit 1
          fi
          
          yes | flet build apk main.py
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          path: build/apk/*.apk
