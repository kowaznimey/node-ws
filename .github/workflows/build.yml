name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Advanced Linux SDK & Android Compiler Dependencies
        run: |
          # Broken pipe လုံးဝမဖြစ်စေရန် Native C/C++ Libraries များနှင့် Compiler Tools များကို ကြိုတင်အပြည့်အစုံသွင်းခြင်း
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pre-Accept Android SDK Licenses
        run: |
          # လိုင်စင်ပိတ်မိပြီး ပျက်ကျခြင်းမရှိစေရန် ကြိုတင်အတည်ပြုခြင်း
          yes | flutter doctor --android-licenses || true

      - name: Install Flet & Required Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet aiohttp requests charset-normalizer idna urllib3 certifi cryptography

      - name: Smart Verify and Pack Flet Structure
        run: |
          if [ ! -f "main.py" ]; then
            echo "Error: ပင်မမျက်နှာစာ main.py ဖိုင်အား ရှာမတွေ့ပါ။"
            exit 1
          fi
          
          # Flet Workspace သီးသန့်တည်ဆောက်ခြင်း
          mkdir -p src
          cp main.py src/main.py
          
          # ModuleNotFoundError လုံးဝမတက်စေရန် လိုအပ်မည့် Dependencies အားလုံး ထည့်သွင်းခြင်း
          cat <<EOF > src/requirements.txt
          flet
          aiohttp
          requests
          charset-normalizer
          idna
          urllib3
          certifi
          cryptography
          EOF
          
          # ဗားရှင်းမကိုက်ညီမှုကြောင့် Error မတက်စေရန် အပို argument များအားလုံး ဖြုတ်ချပြီး Safe Mode ဖြင့် build ခြင်း
          yes | flet build apk src

      - name: Upload Finished Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          # Zip ဖြည်လိုက်လျှင် Folder မရှုပ်ဘဲ .apk သီးသန့်တန်းထွက်လာစေမည့် လမ်းကြောင်း
          path: src/build/apk/*.apk
