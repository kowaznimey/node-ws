name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter & Android SDK dependencies
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet and Packages
        run: |
          pip install --upgrade pip
          pip install flet aiohttp requests charset-normalizer idna urllib3

      - name: Build Android APK using Flet
        run: |
          # SDK ဒေါင်းလုဒ်လုပ်ရန် တောင်းဆိုချက်များကို 'yes |' သုံး၍ အလိုအလျောက် အတည်ပြုကျော်ဖြတ်ခြင်း
          yes | flet build apk main.py

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          path: build/apk/*.apk
