name: Build Flet Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter & Android SDK dependencies
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa openjdk-17-jdk
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Flet and Packages
        run: |
          pip install --upgrade pip
          pip install flet aiohttp requests charset-normalizer idna urllib3

      - name: Init Flet App Structure and Build APK
        run: |
          # ၁။ Flet စနစ် မျှော်လင့်ထားသည့် လုပ်ငန်းခွင် ပတ်ဝန်းကျင်တစ်ခုအား တည်ဆောက်ခြင်း
          mkdir -p flet_app_build
          
          # ၂။ သင့်ထံမှ main.py အား အဆိုပါ ပတ်ဝန်းကျင်အသစ်တွင်းသို့ ကူးပြောင်းထည့်သွင်းခြင်း
          cp main.py flet_app_build/main.py
          
          # ၃။ ထို Folder ထဲသို့ ဝင်ရောက်ပြီးမှ APK အား စနစ်တကျ ဆောက်လုပ်ခြင်း
          cd flet_app_build
          yes | flet build apk main.py

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Bypass-APK
          path: flet_app_build/build/apk/*.apk
